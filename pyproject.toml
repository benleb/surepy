[tool.poetry]
authors = ["Ben Lebherz <git@benleb.de>"]
classifiers = [
  "Topic :: Home Automation",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Development Status :: 4 - Beta",
  "Development Status :: 5 - Production/Stable",
]
description = "Library to interact with the flaps & doors from Sure Petcare."
documentation = "https://surepy.readthedocs.io"
homepage = "https://github.com/benleb/surepy"
keywords = ["cat", "surepetcare", "home-assistant"]
license = "MIT"
name = "surepy"
readme = "README.md"
repository = "https://github.com/benleb/surepy"
version = "0.9.0"

[tool.poetry.dependencies]
python = "^3.14.2"
aiohttp = {extras = ["speedups"], version = ">=3.14.4"}
click = ">=8.1.8"
rich = ">=14.2.0"

[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
black = "^26.10.1"
coverage = {extras = ["toml"], version = "^7.16.2"}
isort = "^9.0.2"
mypy = "^2.4.0"
pycodestyle = "^2.15.0"
pylint = "^4.1.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"

[tool.poetry.scripts]
surepy = 'surepy.surecli:cli'

[tool.pylint.MASTER]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  # design heuristics, disabled like in home assistant; fixing them would change public signatures
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-positional-arguments",
]
ignore = ["tests", "const.py", "surecli"]

# Use a conservative default here; 2 should speed up most setups and not hurt
# any too bad. Override on command line as appropriate.
jobs = 3
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
]

[tool.pylint.BASIC]
good-names = ["_", "id", "sp", "at"]

[tool.pylint.TYPING]
py-version = "3.14"
runtime-typing = false

[tool.pylint.FORMAT]
max-line-length = 100

[tool.isort]
balanced_wrapping = true
combine_as_imports = true
combine_star = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 100
lines_between_types = 1
multi_line_output = 3
order_by_type = true
use_parentheses = true

[tool.black]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''
include = '\.pyi?$'
line-length = 100
target_version = ["py314"]

[tool.pytest.ini_options]
addopts = "--cov --setup-show --code-highlight=yes --verbose"
minversion = "6.0"
testpaths = ["tests"]

[tool.coverage.paths]
source = ["surepy"]

[tool.coverage.run]
branch = true
source = ["surepy"]

[tool.coverage.report]
show_missing = true

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry_core>=1.0.0"]
